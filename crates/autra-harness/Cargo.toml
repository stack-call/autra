[package]
name = "autra-harness"
description = "ReAct engine, model provider boundary, context and tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
autra-core = { path = "../autra-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"
