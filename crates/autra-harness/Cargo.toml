[package]
name = "autra-harness"
description = "ReAct engine, model provider boundary, context and tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
autra-core = { path = "../autra-core" }
autra-execution = { path = "../autra-execution" }
async-trait = "0.1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt", "time", "io-util", "macros"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"], optional = true }

[features]
default = []
process = ["dep:tokio", "dep:windows-sys"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"
