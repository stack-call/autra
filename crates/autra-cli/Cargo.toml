[package]
name = "autra-cli"
description = "autractl: run agents locally, stream events, handle approvals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "autractl"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
autra-core = { path = "../autra-core" }
autra-durable-sqlite = { path = "../autra-durable-sqlite" }
autra-harness = { path = "../autra-harness" }
autra-openai = { path = "../autra-openai" }
autra-runtime = { path = "../autra-runtime" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
