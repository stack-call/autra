[package]
name = "autra"
description = "Product facade: Agent, Session and Subagent assembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "scalability"
harness = false

[dev-dependencies]
autra-durable-sqlite = { path = "../autra-durable-sqlite" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
tracing-test = { version = "0.2", features = ["no-env-filter"] }

[dependencies]
autra-core = { path = "../autra-core" }
autra-execution = { path = "../autra-execution" }
autra-harness = { path = "../autra-harness", features = ["process"] }
autra-runtime = { path = "../autra-runtime" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
