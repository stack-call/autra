[package]
name = "autra-runtime"
description = "Local execution engine: dispatch, outbox, resume and concurrency"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
autra-core = { path = "../autra-core" }
autra-execution = { path = "../autra-execution" }
futures-util = "0.3"
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }
