[package]
name = "autra-runtime"
description = "Local execution host: effect dispatch, sessions, structured concurrency"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
autra-core = { path = "../autra-core" }
autra-harness = { path = "../autra-harness" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
