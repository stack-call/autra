[package]
name = "autra-durable-sqlite"
description = "SQLite effect journal for Autra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
autra-core = { path = "../autra-core" }
autra-execution = { path = "../autra-execution" }
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
autra = { path = "../autra" }
autra-harness = { path = "../autra-harness", features = ["process"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
